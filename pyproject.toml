[project]
name = "ascii-prism"
version = "0.2.0"
description = "Turn the space between your fingertips into live ASCII art, straight from your webcam."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "mediapipe>=0.10.14,<1",
  "opencv-python>=4.9",
  "numpy>=1.26",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ascii-prism = "ascii_prism.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ascii_prism*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
